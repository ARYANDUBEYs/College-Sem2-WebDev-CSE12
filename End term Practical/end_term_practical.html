<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even/Odd checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 350px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        .result {
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }
    </style>
</head>
<body>
   <div class="container">
    <h2>Even or Odd Checker</h2>
    
    <label>Enter a number:</label>
    <input type="number" id="userNumber" placeholder="Type any number...">
    
    <button onclick="checkEvenOdd()">Check Number</button>

    <div id="resultDisplay" class="result"></div>
</div>

<script>
function checkEvenOdd() {
    let num = Number(document.getElementById("userNumber").value);
    let display = document.getElementById("resultDisplay");
    if (document.getElementById("userNumber").value === "") {
        display.innerHTML = "Please enter a valid number first!";
        display.style.color = "orange";
        return; 
    }
    if (num % 2 === 0) {
        display.innerHTML = `${num} is an EVEN number!`;
        display.style.color = "blue";
    } else {
        display.innerHTML = `${num} is an ODD number!`;
        display.style.color = "purple";
    }
}
</script> 
</body>
</html>
